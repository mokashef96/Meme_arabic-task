<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة القراءة - Reading Journey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>السلم والثعبان: رحلة القراءة 📚</h1>
    
    <div id="game-container">
        <div id="board"></div>
        
        <div id="controls">
            <div class="setup-container">
                <div class="control-box">
                    <label for="lesson-index">Select Word:</label>
                    <select id="lesson-index" onchange="jumpToLesson()"></select>
                </div>
                <div class="control-box">
                    <label for="start-pos">Go to:</label>
                    <input type="number" id="start-pos" min="1" max="99" value="1">
                    <button class="small-btn" onclick="setStartPos()">Move</button>
                </div>
            </div>

            <div id="dice-display">🎲</div>
            <button id="ask-btn" onclick="drawCard()">اسحب بطاقة 📝</button>
            <button id="dice-btn" onclick="rollDice()" disabled>ارمي النرد</button>
            <p id="message">Choose a word or draw a card to start!</p>
        </div>
    </div>

    <!-- مربع الحوار المتعدد الأغراض -->
    <div id="quiz-modal" class="hidden">
        <div class="modal-content">
            
            <!-- 1. قسم عرض الكلمة لأول مرة -->
            <div id="lesson-section" class="hidden">
                <h2 id="lesson-title"></h2>
                <div class="lesson-box">
                    <p id="lesson-text-ar" class="lesson-ar"></p>
                    <p id="lesson-text-en" class="lesson-en" dir="ltr"></p>
                </div>
                <button id="understand-btn" onclick="showQuestion()" class="action-btn">Ready for sounds! 🚀</button>
                <button id="close-fail-btn" onclick="closeModalAndWait()" class="fail-btn hidden">Back to Board</button>
            </div>
            
            <!-- 2. قسم أسئلة الحروف -->
            <div id="question-section" class="hidden">
                <p id="chapter-branch-label" class="badge"></p>
                <h3 id="question-counter"></h3>
                <p class="instruction" dir="ltr">How do you pronounce this sound?</p>
                <div id="target-letter" class="huge-letter"></div>
                <div id="options" dir="ltr"></div>
            </div>

            <!-- 3. التحدي النهائي (تقييم قراءة الكلمة كاملة) -->
            <div id="final-check-section" class="hidden">
                <p class="badge" style="font-size: 16px;">Final Challenge! التحدي النهائي</p>
                <p class="instruction" dir="ltr">Read the whole word:</p>
                <div id="final-word-ar" class="huge-letter" style="color: #8e44ad; font-size: 55px;"></div>
                <p class="instruction" dir="ltr">Did she read it correctly?</p>
                <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px;">
                    <button class="action-btn" onclick="handleFinalWord(true)" style="font-size: 16px;">✅ Correct (صح)</button>
                    <button class="fail-btn" onclick="handleFinalWord(false)" style="font-size: 16px;">❌ Incorrect (خطأ)</button>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
